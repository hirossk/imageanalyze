<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像解析デモ Web版</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --accent:#1983ff; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Meiryo UI","Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; background:var(--panel); font-size:22px; font-weight:bold; }
  main { max-width:1100px; margin:0 auto; padding:20px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .card { background:var(--panel); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:16px; color:var(--muted); font-weight:600; }
  video, #preview { width:100%; border-radius:8px; background:#000; display:block; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px;
           padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.sec { background:#334155; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, input[type=range], input[type=number], textarea {
    background:#0f172a; color:var(--text); border:1px solid #334155;
    border-radius:6px; padding:6px; font-family:inherit; }
  textarea { width:100%; min-height:80px; resize:vertical; }
  label { font-size:13px; color:var(--muted); }
  .results { margin-top:10px; font-size:13px; max-height:220px; overflow:auto; }
  .results table { width:100%; border-collapse:collapse; }
  .results th, .results td { text-align:left; padding:4px 6px; border-bottom:1px solid #334155; }
  .summary { margin-top:8px; color:var(--accent); font-weight:bold; }
  .status { font-size:12px; color:var(--muted); min-height:16px; margin-top:6px; }
  .err { color:#f87171; }
  .full { grid-column:1 / -1; }
  .field { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  #answer { white-space:pre-wrap; margin-top:10px; line-height:1.6; }
  /* 段階解放 */
  .locked { display:none; }
  #stepBar { background:linear-gradient(90deg,#13315c,#1e293b); border:1px solid #244; }
  .stepbar-inner { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  #stepTitle { font-size:15px; font-weight:bold; }
  #stepDesc { font-size:13px; color:var(--muted); margin-top:4px; }
  #stepCounter { font-size:12px; color:var(--muted); }
  #nextStep { font-size:15px; padding:11px 18px; }
  .new-feature { animation:flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow:0 0 0 3px var(--accent); } to { box-shadow:0 0 0 0 rgba(0,0,0,0); } }
  @media (max-width:820px){ main{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>画像解析デモ Web版　<span style="font-size:13px;color:var(--muted)">AWS Rekognition / Translate / Polly / Bedrock</span></header>
<main>

  <!-- 段階解放コントローラ -->
  <section class="card full" id="stepBar">
    <div class="stepbar-inner">
      <div>
        <div id="stepTitle">読み込み中...</div>
        <div id="stepDesc"></div>
        <div id="stepCounter"></div>
      </div>
      <button id="nextStep" disabled>▶ 次の機能へ</button>
    </div>
  </section>

  <!-- 入力 -->
  <section class="card">
    <h2>① 入力（カメラ または 画像ファイル）</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div class="row">
      <button id="startCam">カメラ開始</button>
      <button id="stopCam" class="sec" disabled>カメラ停止</button>
      <button id="capture" disabled>この瞬間を取り込む</button>
      <label class="sec" style="background:#334155;border-radius:8px;padding:9px 14px;cursor:pointer;color:#fff">
        画像ファイル<input id="file" type="file" accept="image/*" style="display:none">
      </label>
    </div>
    <div class="status" id="camStatus"></div>
  </section>

  <!-- 解析結果 -->
  <section class="card">
    <h2>② 解析結果</h2>
    <img id="preview" alt="ここに取り込んだ画像・解析結果が表示されます">
    <!-- 解析ボタンは features 設定から段階的に生成される -->
    <div class="row" id="detectButtons"></div>
    <div class="status" id="detStatus"></div>
    <div class="summary" id="summary"></div>
    <div class="results" id="results"></div>
  </section>

  <!-- 音声合成（初期は非表示、ステップ解放で表示） -->
  <section class="card full locked" id="pollyCard">
    <h2>③ 音声合成（Polly）</h2>
    <textarea id="pollyText"></textarea>
    <div class="field">
      <label>音声
        <select id="voice">
          <option value="Kazuha">Kazuha（女性/neural）</option>
          <option value="Tomoko">Tomoko（女性/neural）</option>
          <option value="Takumi">Takumi（男性/neural）</option>
          <option value="Mizuki">Mizuki（女性/standard）</option>
        </select>
      </label>
      <label>速度 <span id="speedVal">100</span>%
        <input id="speed" type="range" min="50" max="150" value="100">
      </label>
      <button id="speak">音声合成して再生</button>
    </div>
    <div class="status" id="pollyStatus"></div>
    <audio id="audio" controls style="width:100%;margin-top:8px;display:none"></audio>
  </section>

  <!-- 生成AI（初期は非表示、ステップ解放で表示） -->
  <section class="card full locked" id="bedrockCard">
    <h2>④ 生成AI（Bedrock / Claude）</h2>
    <textarea id="prompt"></textarea>
    <div class="field">
      <button id="ask">質問する</button>
      <button id="speakAnswer" class="sec" disabled>回答を読み上げる</button>
    </div>
    <div class="status" id="bedrockStatus"></div>
    <div id="answer"></div>
  </section>

</main>

<script>
"use strict";

/* ============================================================
   API クライアント（サーバ呼び出しはすべてここに集約）
   ============================================================ */
const Api = {
  // JSON を返すエンドポイント共通処理
  async requestJson(url, options) {
    const response = await fetch(url, options);
    let data = null;
    try {
      data = await response.json();
    } catch (error) {
      data = null;
    }
    if (!response.ok) {
      const detail = data && data.detail ? data.detail : (url + " の呼び出しに失敗しました");
      throw new Error(detail);
    }
    return data;
  },

  features() {
    return this.requestJson("/api/features");
  },

  defaults() {
    return this.requestJson("/api/defaults");
  },

  detect(mode, image) {
    const formData = new FormData();
    formData.append("mode", mode);
    formData.append("image", image);
    return this.requestJson("/api/detect", { method: "POST", body: formData });
  },

  bedrock(prompt) {
    const formData = new FormData();
    formData.append("prompt", prompt);
    return this.requestJson("/api/bedrock", { method: "POST", body: formData });
  },

  // Polly だけは音声(バイナリ)を返すので特別扱い
  async polly(text, voice, speed) {
    const formData = new FormData();
    formData.append("text", text);
    formData.append("voice", voice);
    formData.append("speed", speed);
    const response = await fetch("/api/polly", { method: "POST", body: formData });
    if (!response.ok) {
      let data = null;
      try {
        data = await response.json();
      } catch (error) {
        data = null;
      }
      throw new Error(data && data.detail ? data.detail : "音声合成に失敗しました");
    }
    return response.blob();
  }
};

/* ============================================================
   要素の取得
   ============================================================ */
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

const startCamButton = document.getElementById("startCam");
const stopCamButton = document.getElementById("stopCam");
const captureButton = document.getElementById("capture");
const camStatus = document.getElementById("camStatus");
const fileInput = document.getElementById("file");

const detectButtons = document.getElementById("detectButtons");
const summaryElement = document.getElementById("summary");
const resultsElement = document.getElementById("results");
const detectStatus = document.getElementById("detStatus");

const pollyCard = document.getElementById("pollyCard");
const speedInput = document.getElementById("speed");
const speedValue = document.getElementById("speedVal");
const speakButton = document.getElementById("speak");
const pollyTextInput = document.getElementById("pollyText");
const pollyStatus = document.getElementById("pollyStatus");
const voiceSelect = document.getElementById("voice");
const audioElement = document.getElementById("audio");

const bedrockCard = document.getElementById("bedrockCard");
const askButton = document.getElementById("ask");
const promptInput = document.getElementById("prompt");
const bedrockStatus = document.getElementById("bedrockStatus");
const answerElement = document.getElementById("answer");
const speakAnswerButton = document.getElementById("speakAnswer");

const stepTitle = document.getElementById("stepTitle");
const stepDesc = document.getElementById("stepDesc");
const stepCounter = document.getElementById("stepCounter");
const nextStepButton = document.getElementById("nextStep");

/* ============================================================
   状態
   ============================================================ */
let stream = null;
let currentImage = null;   // base64 の dataURL
let features = [];         // /api/features の配列
let nextIndex = 0;         // 次に解放する features のインデックス

/* ============================================================
   共通の小さな関数
   ============================================================ */
function showError(element, message) {
  element.textContent = "";
  const span = document.createElement("span");
  span.className = "err";
  span.textContent = message;
  element.appendChild(span);
}

/* ============================================================
   段階解放（ステップ制御）
   ============================================================ */
function revealFeature(feature) {
  if (feature.kind === "detect") {
    addDetectButton(feature);
  } else if (feature.kind === "polly") {
    pollyCard.classList.remove("locked");
    pollyCard.classList.add("new-feature");
  } else if (feature.kind === "bedrock") {
    bedrockCard.classList.remove("locked");
    bedrockCard.classList.add("new-feature");
  }
  // input は最初から表示されているので何もしない
}

function addDetectButton(feature) {
  const button = document.createElement("button");
  button.textContent = feature.title;
  button.dataset.mode = feature.mode;
  button.className = "new-feature";
  button.disabled = (currentImage === null);
  button.addEventListener("click", function () {
    detect(feature.mode);
  });
  detectButtons.appendChild(button);
}

function updateStepBar(justRevealed) {
  if (justRevealed) {
    stepTitle.textContent = "解放：Step " + justRevealed.step + "「" + justRevealed.title + "」";
    stepDesc.textContent = justRevealed.desc;
  }
  if (nextIndex < features.length) {
    const next = features[nextIndex];
    nextStepButton.disabled = false;
    nextStepButton.textContent = "▶ 次の機能へ（Step " + next.step + "：" + next.title + "）";
  } else {
    nextStepButton.disabled = true;
    nextStepButton.textContent = "🎉 全機能を解放しました";
  }
  stepCounter.textContent = "解放済み " + nextIndex + " / " + features.length;
}

function revealNext() {
  if (nextIndex >= features.length) {
    return;
  }
  const feature = features[nextIndex];
  revealFeature(feature);
  nextIndex += 1;
  updateStepBar(feature);
}

nextStepButton.addEventListener("click", revealNext);

/* ============================================================
   カメラ
   ============================================================ */
startCamButton.addEventListener("click", async function () {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    startCamButton.disabled = true;
    stopCamButton.disabled = false;
    captureButton.disabled = false;
    camStatus.textContent = "カメラ動作中。「この瞬間を取り込む」を押してください。";
  } catch (error) {
    showError(camStatus, "カメラを開始できません: " + error.message);
  }
});

stopCamButton.addEventListener("click", function () {
  if (stream !== null) {
    const tracks = stream.getTracks();
    for (let i = 0; i < tracks.length; i++) {
      tracks[i].stop();
    }
    stream = null;
  }
  startCamButton.disabled = false;
  stopCamButton.disabled = true;
  captureButton.disabled = true;
  camStatus.textContent = "";
});

captureButton.addEventListener("click", function () {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const context = canvas.getContext("2d");
  context.drawImage(video, 0, 0);
  setImage(canvas.toDataURL("image/jpeg", 0.9));
});

/* ============================================================
   ファイル選択
   ============================================================ */
fileInput.addEventListener("change", function (event) {
  const file = event.target.files[0];
  if (!file) {
    return;
  }
  const reader = new FileReader();
  reader.addEventListener("load", function () {
    setImage(reader.result);
  });
  reader.readAsDataURL(file);
});

function setImage(dataURL) {
  currentImage = dataURL;
  preview.src = dataURL;
  updateDetectButtons();
  summaryElement.textContent = "";
  resultsElement.textContent = "";
  detectStatus.textContent = "取り込み完了。解放済みの解析ボタンを押してください。";
}

// 解放済み解析ボタンの有効/無効を画像の有無で更新
function updateDetectButtons() {
  const buttons = detectButtons.querySelectorAll("button");
  for (let i = 0; i < buttons.length; i++) {
    buttons[i].disabled = (currentImage === null);
  }
}

/* ============================================================
   解析
   ============================================================ */
async function detect(mode) {
  if (currentImage === null) {
    return;
  }
  detectStatus.textContent = "解析中...";
  summaryElement.textContent = "";
  resultsElement.textContent = "";

  try {
    const data = await Api.detect(mode, currentImage);
    preview.src = data.image;
    summaryElement.textContent = data.summary;
    renderResults(data.results);
    detectStatus.textContent = "";
  } catch (error) {
    showError(detectStatus, error.message);
  }
}

function renderResults(rows) {
  resultsElement.textContent = "";
  if (!rows || rows.length === 0) {
    return;
  }

  const columns = Object.keys(rows[0]);
  const table = document.createElement("table");

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");
  for (let i = 0; i < columns.length; i++) {
    const th = document.createElement("th");
    th.textContent = columns[i];
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (let i = 0; i < rows.length; i++) {
    const tr = document.createElement("tr");
    for (let j = 0; j < columns.length; j++) {
      const td = document.createElement("td");
      td.textContent = rows[i][columns[j]];
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);

  resultsElement.appendChild(table);
}

/* ============================================================
   Polly（音声合成）
   ============================================================ */
speedInput.addEventListener("input", function () {
  speedValue.textContent = speedInput.value;
});

speakButton.addEventListener("click", function () {
  speak(pollyTextInput.value, pollyStatus);
});

async function speak(text, statusElement) {
  statusElement.textContent = "音声合成中...";
  try {
    const blob = await Api.polly(text, voiceSelect.value, speedInput.value);
    audioElement.src = URL.createObjectURL(blob);
    audioElement.style.display = "block";
    audioElement.play();
    statusElement.textContent = "";
  } catch (error) {
    showError(statusElement, error.message);
  }
}

/* ============================================================
   Bedrock（生成AI）
   ============================================================ */
askButton.addEventListener("click", async function () {
  bedrockStatus.textContent = "生成AIに問い合わせ中...";
  answerElement.textContent = "";
  speakAnswerButton.disabled = true;

  try {
    const data = await Api.bedrock(promptInput.value);
    answerElement.textContent = data.answer;
    bedrockStatus.textContent = "";
    speakAnswerButton.disabled = false;
  } catch (error) {
    showError(bedrockStatus, error.message);
  }
});

speakAnswerButton.addEventListener("click", function () {
  voiceSelect.value = "Takumi";
  speak(answerElement.textContent, bedrockStatus);
});

/* ============================================================
   起動時：機能一覧と初期値の読み込み
   ============================================================ */
async function initialize() {
  try {
    const data = await Api.features();
    features = data.features || [];
    // Step 1（input）は最初から解放しておく
    if (features.length > 0) {
      nextIndex = 1;
      updateStepBar(features[0]);
    }
  } catch (error) {
    showError(stepDesc, "機能一覧の取得に失敗しました: " + error.message);
  }

  try {
    const defaults = await Api.defaults();
    pollyTextInput.value = defaults.polly_text || "";
    promptInput.value = defaults.bedrock_prompt || "";
  } catch (error) {
    console.error("初期値の取得に失敗しました", error);
  }
}

initialize();
</script>
</body>
</html>
